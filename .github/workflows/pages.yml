name: Deploy MEMS Release demo

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mems-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Extract verified public sources
        run: unzip -q MEMS-pages-source.zip -d site
      - name: Run the published notebook's verification cells on Linux
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path('MEMS-crosscheck.ipynb').read_text(encoding='utf-8'))
          included = json.loads(Path('site/public/release-audit/MEMS-crosscheck.ipynb').read_text(encoding='utf-8'))
          if notebook != included:
              raise SystemExit('Published and packaged notebooks differ')
          session = {'__name__': '__main__'}
          for cell in notebook['cells']:
              if cell['id'] in {'prepare', 'dependencies', 'audit'}:
                  exec(compile(cell['source'], f"Notebook cell {cell['id']}", 'exec'), session)
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: site
      - run: npm run build:pages
        working-directory: site
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site/dist
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..8}; do
            if artifact_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id') && [ -n "$artifact_id" ]; then
              echo "Pages artifact is ready: $artifact_id"
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub has not listed the uploaded Pages artifact."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
